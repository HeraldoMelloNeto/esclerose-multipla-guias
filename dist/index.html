<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esclerose Múltipla — Guias Clínico e Radiológico</title>
<meta name="description" content="Assistente interativo de Esclerose Múltipla: critérios McDonald 2024, recomendações MAGNIMS-CMSC-NAIMS 2024, LCR, OCT/PEV, checklist de protocolo, interpretação guiada e laudo estruturado.">
<meta name="author" content="Dr. Heraldo Mello Neto">
<meta name="theme-color" content="#0b1120">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{background:#0b1120;color:#e8edf5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:2px solid #4f8ff7;outline-offset:2px}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:#0b1120}::-webkit-scrollbar-thumb{background:#1c2a4a;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:50;background:#0b1120ee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #1c2a4a}
.topbar .wrap{padding:8px 12px 6px}
.brand{background:none;border:none;color:#4f8ff7;font-weight:900;font-size:13px;letter-spacing:.4px;cursor:pointer;display:flex;align-items:center;gap:6px}
.brand span{color:#e8edf5}
.modbtn{padding:6px 12px;border-radius:8px;border:1px solid;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.modebtn{display:flex;align-items:center;gap:6px;background:#111a2e;border:1px solid #1c2a4a;border-radius:14px;padding:4px 10px;cursor:pointer;font-size:10.5px;font-weight:700}
.modebtn .knob{width:28px;height:16px;border-radius:8px;position:relative;display:inline-block}
.modebtn .knob span{width:12px;height:12px;border-radius:6px;background:#fff;position:absolute;top:2px;transition:left .2s}
.subnav{display:flex;gap:3px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{padding:5px 10px;border-radius:6px;border:none;white-space:nowrap;font-size:11px;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;padding:15px;border-radius:10px;border:1px solid;cursor:pointer;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-1px);border-color:#4f8ff7 !important}
.btn{padding:10px 14px;border-radius:8px;border:none;background:#4f8ff7;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid #1c2a4a;color:#94a3bf}
.btn:hover{filter:brightness(1.08)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.sticky{position:sticky;top:96px}
.foot{text-align:center;font-size:9.5px;color:#5a6a8a;padding:14px 10px 18px;letter-spacing:.4px;font-family:ui-monospace,Menlo,monospace}
@media (max-width:820px){.tiles{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.sticky{position:static}}
@media (max-width:560px){.grid2,.tiles{grid-template-columns:1fr}.inforow{flex-direction:column;gap:2px !important}.inforow span:first-child{min-width:0 !important}}
@media print{.topbar,.foot,.btn{display:none !important}body{background:#fff;color:#000}}
#boot{display:flex;align-items:center;justify-content:center;height:100vh;color:#94a3bf;font-size:13px}
</style>
</head>

<div id="root"><div id="boot">Carregando…</div></div>
